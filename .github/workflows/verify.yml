name: Verify application contracts

on:
  pull_request:
    branches: [develop, main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'src/**/requirements.txt'
      - run: pip install -r src/api/requirements.txt -r src/agent/requirements.txt -r src/lakehouse/requirements.txt pytest pytest-asyncio fsspec
      - run: python -m pytest tests -q
      - run: docker compose --profile full config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
