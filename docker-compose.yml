# ==============================================================================
# Midas — Monodocker Compose Infrastructure Master
# Enterprise Active Lakehouse & Conversational Intelligence Platform
# ==============================================================================

name: midas

networks:
  midas-network:
    name: midas-network
    driver: bridge

volumes:
  postgres_data:
    name: midas_postgres_data
  minio_data:
    name: midas_minio_data
  opensearch_data:
    name: midas_opensearch_data
  ollama_data:
    name: midas_ollama_data

services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos Central Multi-Tenant (PostgreSQL 16)
  # Metastore Iceberg REST, Fuentes Operacionales, OpenMetadata y Airflow
  # ----------------------------------------------------------------------------
  midas-postgres:
    image: postgres:16-alpine
    container_name: midas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-midas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midas_secret_password_2026}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-iceberg_catalog,midas_operational,openmetadata_db,airflow_db,midas_guardian}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/00-init-multi-db.sh:ro
      - ./docker/postgres/01-init-operational-seed.sql:/docker-entrypoint-initdb.d/01-init-operational-seed.sql:ro
    networks:
      - midas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midas_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Almacenamiento de Objetos S3 Distribuido (MinIO)
  # Buckets: bronze, silver, gold, quarantine, governance
  # ----------------------------------------------------------------------------
  midas-minio:
    # minio/minio fue retirada de Docker Hub y quay.io exige credenciales.
    # bitnamilegacy publica el ultimo build comunitario de MinIO.
    image: bitnamilegacy/minio:latest
    container_name: midas-minio
    restart: unless-stopped
    user: "0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-midas_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-midas_minio_secret_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - midas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ----------------------------------------------------------------------------
  # 2.1. Inicializador de Buckets MinIO (Squad 1 - Edgar Corzo)
  # ----------------------------------------------------------------------------
  midas-minio-init:
    # minio/mc fue retirada de Docker Hub junto con minio/minio.
    image: bitnamilegacy/minio-client:latest
    container_name: midas-minio-init
    restart: "no"
    depends_on:
      midas-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - sed 's#/usr/bin/mc#mc#g' /init_buckets.sh > /tmp/init_buckets.sh && exec /bin/sh /tmp/init_buckets.sh
    volumes:
      - ./docker/minio/init_buckets.sh:/init_buckets.sh:ro
    environment:
      MINIO_ENDPOINT: http://midas-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-midas_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-midas_minio_secret_2026}
    networks:
      - midas-network

  # ----------------------------------------------------------------------------
  # 3. Catálogo Iceberg REST (Preparado para Squad 1 - Edgar Corzo)
  # ----------------------------------------------------------------------------
  midas-iceberg-catalog:
    image: tabulario/iceberg-rest:1.5.0
    container_name: midas-iceberg-catalog
    restart: unless-stopped
    profiles: ["lakehouse", "full"]
    depends_on:
      midas-postgres:
        condition: service_healthy
      midas-minio:
        condition: service_healthy
      midas-minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://midas-bronze/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://midas-minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3__ENDPOINT: http://midas-minio:9000
      CATALOG_S3__PATH_STYLE_ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-midas_minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-midas_minio_secret_2026}
      AWS_REGION: us-east-1
      CATALOG_BACKEND: jdbc
      CATALOG_URI: jdbc:postgresql://midas-postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${POSTGRES_USER:-midas_admin}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-midas_secret_password_2026}
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    networks:
      - midas-network

  # ----------------------------------------------------------------------------
  # 3.1. Motor de Consultas Distribuido (Trino 450)
  # Catálogos federados sobre Apache Iceberg REST y PostgreSQL Operacional
  # ----------------------------------------------------------------------------
  midas-trino:
    image: trinodb/trino:450
    container_name: midas-trino
    restart: unless-stopped
    profiles: ["lakehouse", "query", "full"]
    depends_on:
      midas-postgres:
        condition: service_healthy
      midas-minio:
        condition: service_healthy
    ports:
      - "${TRINO_PORT:-8082}:8080"
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    networks:
      - midas-network

  # ----------------------------------------------------------------------------
  # 3.2. Cómputo Distribuido: Apache Spark 3.5 Master & Worker (Squad 1 - Daniel Echeverría)
  # Motor de procesamiento distribuido para transformaciones Bronze, Silver y Gold
  # ----------------------------------------------------------------------------
  midas-spark-master:
    # bitnami/spark:3.5.1 fue movida al namespace bitnamilegacy.
    image: bitnamilegacy/spark:3.5.1
    container_name: midas-spark-master
    restart: unless-stopped
    profiles: ["lakehouse", "spark", "orchestration", "full"]
    depends_on:
      midas-minio:
        condition: service_healthy
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_WEBUI_PORT:-8086}:8080"
    volumes:
      - ./docker/spark/jars:/opt/midas/spark-jars:ro
      - ./docker/spark/conf/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./jobs:/opt/midas/jobs:ro
    networks:
      - midas-network

  midas-spark-worker:
    # bitnami/spark:3.5.1 fue movida al namespace bitnamilegacy.
    image: bitnamilegacy/spark:3.5.1
    container_name: midas-spark-worker
    restart: unless-stopped
    profiles: ["lakehouse", "spark", "orchestration", "full"]
    depends_on:
      midas-spark-master:
        condition: service_started
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://midas-spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-1G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-1}
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "${SPARK_WORKER_WEBUI_PORT:-8081}:8081"
    volumes:
      - ./docker/spark/jars:/opt/midas/spark-jars:ro
      - ./docker/spark/conf/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./jobs:/opt/midas/jobs:ro
    networks:
      - midas-network

  # ----------------------------------------------------------------------------
  # 3.1. Gobernanza: Catálogo Central y Linaje (Squad 4 - Sebastian Castiblanco)
  # HU-GOV-01: OpenMetadata + OpenSearch como índice de búsqueda y linaje
  # ----------------------------------------------------------------------------
  midas-opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: midas-opensearch
    restart: unless-stopped
    profiles: ["governance", "full"]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - midas-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Ejecuta las migraciones del esquema de OpenMetadata sobre openmetadata_db
  # antes de que arranque el servidor. Termina y no se reinicia.
  midas-openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:1.5.11
    container_name: midas-openmetadata-migrate
    restart: "no"
    profiles: ["governance", "full"]
    depends_on:
      midas-postgres:
        condition: service_healthy
      midas-opensearch:
        condition: service_healthy
    # La imagen declara ENTRYPOINT ["/bin/bash"], asi que el command solo
    # aporta los argumentos del shell.
    command: ["-c", "./bootstrap/openmetadata-ops.sh migrate"]
    environment: &openmetadata-environment
      # Metastore relacional (base openmetadata_db creada por init-multi-db.sh)
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_HOST: midas-postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-midas_admin}
      DB_USER_PASSWORD: ${POSTGRES_PASSWORD:-midas_secret_password_2026}
      OM_DATABASE: openmetadata_db
      # Indice de busqueda y linaje
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_HOST: midas-opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_CLUSTER_ALIAS: midas
      # Autenticacion basica local (sin proveedor externo en el MVP)
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[${OPENMETADATA_ADMIN_PRINCIPAL:-admin}]"
      AUTHORIZER_PRINCIPAL_DOMAIN: ${OPENMETADATA_PRINCIPAL_DOMAIN:-midas.local}
      AUTHENTICATION_PROVIDER: basic
      ENABLE_SECURE_SOCKET: "false"
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
    networks:
      - midas-network

  midas-openmetadata:
    image: docker.getcollate.io/openmetadata/server:1.5.11
    container_name: midas-openmetadata
    restart: unless-stopped
    profiles: ["governance", "full"]
    depends_on:
      midas-openmetadata-migrate:
        condition: service_completed_successfully
    environment: *openmetadata-environment
    ports:
      - "${OPENMETADATA_PORT:-8585}:8585"
      - "${OPENMETADATA_ADMIN_PORT:-8586}:8586"
    networks:
      - midas-network
    healthcheck:
      # La imagen no incluye curl; busybox wget cumple la misma funcion.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8586/healthcheck > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

  # ----------------------------------------------------------------------------
  # 4. Core Backend FastAPI & Hub Telemetría SSE (Squad 1 - Daniel Echeverría)
  # ----------------------------------------------------------------------------
  midas-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: midas-api
    restart: unless-stopped
    profiles: ["api", "full"]
    depends_on:
      midas-postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${OPERATIONAL_DB_URL:-postgresql://midas_admin:midas_secret_password_2026@midas-postgres:5432/midas_operational}
      MINIO_ENDPOINT: http://midas-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-midas_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-midas_minio_secret_2026}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-midas_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-midas_minio_secret_2026}
      # HU-GOV-01: gateway de linaje contra el catalogo central. Sin token el
      # cliente degrada al linaje canonico sin romper el drawer del frontend.
      OPENMETADATA_URL: ${OPENMETADATA_URL:-http://midas-openmetadata:8585}
      OPENMETADATA_JWT_TOKEN: ${OPENMETADATA_JWT_TOKEN:-}
      OPENMETADATA_TIMEOUT_SECONDS: ${OPENMETADATA_TIMEOUT_SECONDS:-3.0}
      OPENMETADATA_SERVICE_ICEBERG: ${OPENMETADATA_SERVICE_ICEBERG:-midas_lakehouse_iceberg}
      OPENMETADATA_SERVICE_POSTGRES: ${OPENMETADATA_SERVICE_POSTGRES:-midas_operational_postgres}
      # HU-GOV-03: politicas Zero-Trust aplicadas antes de enviar a Trino.
      RANGER_URL: ${RANGER_URL:-http://midas-ranger:6080}
      RANGER_LOCAL_ENFORCEMENT: ${RANGER_LOCAL_ENFORCEMENT:-true}
      RANGER_TRINO_PLUGIN_ENABLED: ${RANGER_TRINO_PLUGIN_ENABLED:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
    networks:
      - midas-network

  # --------------------------------------------------------------------------
  # 5. Airflow DAG Factory for approved Gold pipeline specs
  # --------------------------------------------------------------------------
  midas-airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: midas-airflow-init
    profiles: ["orchestration", "full"]
    depends_on:
      midas-postgres:
        condition: service_healthy
      midas-minio-init:
        condition: service_completed_successfully
      midas-spark-master:
        condition: service_started
    entrypoint: ["/bin/bash", "/opt/airflow/init.sh"]
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-midas_admin}:${POSTGRES_PASSWORD:-midas_secret_password_2026}@midas-postgres:5432/airflow_db
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
      AIRFLOW_CONN_SPARK_DEFAULT: ${AIRFLOW_CONN_SPARK_DEFAULT:-spark://midas-spark-master:7077}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-midas_airflow_admin_2026}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@midas.local}
      MIDAS_MINIO_ENDPOINT: http://midas-minio:9000
      MINIO_ENDPOINT: http://midas-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-midas_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-midas_minio_secret_2026}
      MIDAS_GOLD_SPARK_JOB: ${MIDAS_GOLD_SPARK_JOB:-/opt/midas/jobs/materialize_gold.py}
      MIDAS_TELEMETRY_PUBLISH_URL: http://midas-api:8000/api/v1/telemetry/publish
      PYTHONPATH: /opt/midas
    volumes: &airflow-volumes
      - ./docker/airflow/init.sh:/opt/airflow/init.sh:ro
      - ./src/orchestration:/opt/airflow/dags:ro
      - ./src:/opt/midas/src:ro
      - ./jobs:/opt/midas/jobs:ro
      - ./docker/spark/jars:/opt/midas/spark-jars:ro
      - ./docker/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - midas-network

  midas-airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: midas-airflow-webserver
    restart: unless-stopped
    profiles: ["orchestration", "full"]
    depends_on:
      midas-airflow-init:
        condition: service_completed_successfully
    command: webserver
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8085}:8080"
    networks:
      - midas-network

  midas-airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: midas-airflow-scheduler
    restart: unless-stopped
    profiles: ["orchestration", "full"]
    depends_on:
      midas-airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment: *airflow-environment
    volumes: *airflow-volumes
    networks:
      - midas-network

  # ----------------------------------------------------------------------------
  # 6. Inferencia Local Zero-Trust (Ollama con Qwen 2.5 3B)
  # ----------------------------------------------------------------------------
  midas-ollama:
    image: ollama/ollama:latest
    container_name: midas-ollama
    restart: unless-stopped
    profiles: ["ai", "full"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - midas-network

  # ----------------------------------------------------------------------------
  # 7. Consola Web & Workspace Conversacional Multi-Sesión (Next.js 14)
  # ----------------------------------------------------------------------------
  midas-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: midas-frontend
    restart: unless-stopped
    profiles: ["frontend", "full"]
    depends_on:
      - midas-api
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - midas-network
