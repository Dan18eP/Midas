# ==============================================================================
# Midas - Configuración Maestro de Apache Spark 3.5 & Iceberg REST Catalog
# Historia de Usuario: HU-INFRA-02
# Autor: Daniel Echeverría (Backend Lead & Infra)
# ==============================================================================

# Master de Spark en la red Docker
spark.master                               spark://midas-spark-master:7077
spark.app.name                             midas-lakehouse-engine

# Integración con Apache Iceberg REST Catalog
spark.sql.extensions                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                   iceberg
spark.sql.catalog.iceberg                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type             rest
spark.sql.catalog.iceberg.uri              http://midas-iceberg-catalog:8181
spark.sql.catalog.iceberg.warehouse        s3://midas-bronze/
spark.sql.catalog.iceberg.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint      http://midas-minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true

# Conexión S3A contra MinIO
spark.hadoop.fs.s3a.endpoint               http://midas-minio:9000
spark.hadoop.fs.s3a.path.style.access      true
spark.hadoop.fs.s3a.impl                   org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# Spark distributes these matching connectors to the executors.
spark.jars.packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.0,org.apache.iceberg:iceberg-aws-bundle:1.5.0,org.apache.hadoop:hadoop-aws:3.3.4,org.postgresql:postgresql:42.7.3

# JARs externos (Iceberg runtime, AWS bundle) montados desde docker/spark/jars
spark.driver.extraClassPath                /opt/midas/spark-jars/*
spark.executor.extraClassPath              /opt/midas/spark-jars/*

# Ajustes de Ejecución Local Monodocker
spark.driver.memory                        1g
spark.executor.memory                      1g
spark.sql.shuffle.partitions               4
spark.sql.session.timeZone                 UTC
